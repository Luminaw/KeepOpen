name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish KeepOpen/KeepOpen.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Zip Artifact
        run: Compress-Archive -Path ./publish/* -DestinationPath KeepOpen.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: KeepOpen.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
